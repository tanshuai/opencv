name: arm64 build checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/arm64-build-checks.yml
      - .github/scripts/arm64-*

permissions:
  contents: read

concurrency:
  group: arm64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cross-build in the preserved ARM64 legacy sysroot
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            ubuntu@sha256:dca176c9663a7ba4c1f0e710986f5a25e672842963d95b960191e2d9f7185ebe \
            bash .github/scripts/arm64-legacy-build.sh 2>&1 | tee arm64-build.log
      - name: Preserve verified ARM64 outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-build-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            arm64-build.log
            build/arm64-results/**
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log

  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch only the reviewed complete compile revision
        shell: bash
        run: timeout 60 git fetch --no-tags --depth=1 origin 6a2c21f581f48c7d1e59480267f3ca9747c219b9
      - name: Validate current source contracts and real verifier rejection cases
        run: python3 .github/scripts/arm64-workflow-contract.py
